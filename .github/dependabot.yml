version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: pip
    directories: ["/services/api", "/services/anomaly", "/tests/e2e", "/"]
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"] }

  - package-ecosystem: docker
    directories: ["/services/api", "/services/anomaly"]
    schedule: { interval: weekly }