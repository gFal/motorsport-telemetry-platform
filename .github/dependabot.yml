version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: pip
    directories: ["/api", "/anomaly_service", "/tests/e2e", "/"]
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"] }

  - package-ecosystem: docker
    directories: ["/api", "/anomaly_service"]
    schedule: { interval: weekly }