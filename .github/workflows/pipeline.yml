# CI/CD pipeline for the motorsport telemetry platform.

# Pull requests: static infrastructure checks and unit tests.
# Push to main: deploy manifests to the cluster and run smoke tests.
# Manual dispatch: apply Terraform changes after environment approval.
name: motorsport-pipeline

on:
  pull_request:
    branches: 
      - main
  push:
    branches: 
      - main
  workflow_dispatch:            

permissions:
  contents: read

env:
  TF_VERSION: "1.16.1"          
  TF_DIR: infra/agent
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  IMAGE_REGISTRY: ghcr.io/gfal

jobs:
  # Infrastructure validation: formatting, Terraform plan, Ansible lint, manifest schemas.
  plan-and-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID_PLAN }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform -chdir="$TF_DIR" fmt -check -recursive -diff

      - name: terraform validate (no backend, no credentials)
        run: |
          terraform -chdir="$TF_DIR" init -backend=false
          terraform -chdir="$TF_DIR" validate

      - name: Write tfvars from secret
        if: env.SAME_REPO == 'true'
        env:
          TFVARS: ${{ secrets.TFVARS }}
        run: printf '%s\n' "$TFVARS" > "$TF_DIR/ci.auto.tfvars"

      - name: terraform plan (Reader identity, no state lock)
        if: env.SAME_REPO == 'true'
        run: |
          terraform -chdir="$TF_DIR" init -reconfigure
          terraform -chdir="$TF_DIR" plan -lock=false -out=tfplan
          {
            echo '### Terraform plan'
            echo '```'
            terraform -chdir="$TF_DIR" show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fork PR notice
        if: env.SAME_REPO != 'true'
        run: echo "::notice::PR from a fork - no Azure credentials; terraform plan skipped, static checks still ran."

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: ansible-lint
        run: |
          pip install --quiet ansible-lint
          if [ -f ansible/requirements.yml ]; then
            ansible-galaxy collection install -r ansible/requirements.yml
          fi
          ansible-lint ansible/

      - name: Render Kustomize overlays
        run: |
          mkdir -p rendered
          for o in prod ci; do
            kubectl kustomize "k3s/overlays/$o" > "rendered/$o.yaml"
          done

      - name: kubeconform (rendered overlays)
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          for o in prod ci; do
            echo "== $o"
            ./kubeconform -strict -summary -ignore-missing-schemas "rendered/$o.yaml"
          done

      - name: e2e suite compiles
        run: python -m compileall -q tests

  # Unit tests, one job per service.
  unit-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false                     # report results for every service
      matrix:                              # matrix running the same job for both values
        service: [api, anomaly_service]
    env:                                   # dummy config for modules that read env vars at import time, never used to connect
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: motorsport
      DB_USER: ci
      DB_PASSWORD: ci
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"  
          cache: pip
          cache-dependency-path: |
            ${{ matrix.service }}/requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: pip install -r "${{ matrix.service }}/requirements.txt" -r requirements-test.txt

      - name: pytest
        working-directory: ${{ matrix.service }}
        run: python -m pytest tests -v --junitxml="../reports/unit-${{ matrix.service }}.xml"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-${{ matrix.service }}
          path: reports/

  # Container image build and vulnerability scan, one job per service.
  image-scan:
    name: image-scan (${{ matrix.service }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write  # SARIF upload to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            image: motorsport-api
          - service: anomaly_service
            image: motorsport-anomaly
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          load: true  # load into the local Docker engine for scanning; never pushed from a pull request
          push: false
          tags: ${{ env.IMAGE_REGISTRY }}/${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Vulnerability gate (fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REGISTRY }}/${{ matrix.image }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # Report only - forks cannot write security events
      - name: Vulnerability report (SARIF)
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: aquasecurity/trivy-action@v0.36.0   
        with:
          image-ref: ${{ env.IMAGE_REGISTRY }}/${{ matrix.image }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
          exit-code: "0"
          format: sarif
          output: trivy-${{ matrix.image }}.sarif

      - name: Upload SARIF to code scanning
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

      - name: Save image for the integration job
        run: docker save "${{ env.IMAGE_REGISTRY }}/${{ matrix.image }}:ci" -o "${{ matrix.image }}.tar"

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.image }}
          path: ${{ matrix.image }}.tar
          retention-days: 1

  # System test of the pull request's images in an ephemeral k3d cluster.
  integration:
    if: github.event_name == 'pull_request'
    needs: image-scan     
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      K3S_IMAGE: rancher/k3s:v1.36.4-k3s1  
      K3D_VERSION: v5.9.0
      API_URL: http://localhost:30080  # API NodePort, mapped to the runner
      K8S_NAMESPACE: default
      API_DEPLOYMENT: motorsport-api
      API_SERVICE: motorsport-api
      ANOMALY_DEPLOYMENT: motorsport-anomaly
      POSTGRES_DEPLOYMENT: postgres
      POSTGRES_SECRET: postgres-secret
      POSTGRES_SECRET_KEY: DB_PASSWORD
      DB_NAME: motorsport
      DB_USER: pitwall
      DB_PROBE_PATH: /cars/1/latest
      CANARY_CAR_ID: "1"
      ANOMALY_POLL_SECONDS: "30"
    steps:
      - uses: actions/checkout@v7

      - name: Download images
        uses: actions/download-artifact@v8
        with:
          pattern: image-*
          merge-multiple: true
          path: images

      - name: Install k3d
        run: curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/$K3D_VERSION/install.sh | TAG="$K3D_VERSION" bash

      - name: Create cluster
        run: |
          k3d cluster create ci --image "$K3S_IMAGE" \
            -p "30080:30080@server:0" \
            --k3s-arg "--disable=traefik@server:0" \
            --wait --timeout 180s
          kubectl get nodes -o wide

      - name: Import images
        run: k3d image import images/*.tar -c ci

      - name: Create database secret
        run: |
          PW=$(openssl rand -hex 16)
          echo "::add-mask::$PW"
          kubectl create secret generic "$POSTGRES_SECRET" \
            --from-literal=POSTGRES_PASSWORD="$PW" --from-literal=DB_PASSWORD="$PW"

      - name: Deploy
        run: kubectl apply -k k3s/overlays/ci

      - name: Wait for database initialisation and rollouts
        run: |
          kubectl rollout status "deploy/$POSTGRES_DEPLOYMENT" --timeout=180s
          for i in $(seq 1 36); do
            n=$(kubectl exec "deploy/$POSTGRES_DEPLOYMENT" -- psql -U "$DB_USER" -d "$DB_NAME" -tAc "SELECT count(*) FROM sensors" 2>/dev/null || echo 0)
            [ "${n:-0}" -gt 0 ] && break
            sleep 5
          done
          [ "${n:-0}" -gt 0 ] || { echo "::error::Schema and seed data not loaded (no rows in sensors)."; exit 1; }
          # Applications may be in crash-loop back-off from starting before the database; restart them to reset it.
          kubectl rollout restart "deploy/$API_DEPLOYMENT" "deploy/$ANOMALY_DEPLOYMENT"
          kubectl rollout status "deploy/$API_DEPLOYMENT" --timeout=180s
          kubectl rollout status "deploy/$ANOMALY_DEPLOYMENT" --timeout=180s

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install --quiet -r tests/e2e/requirements.txt

      - name: Smoke tests
        run: python -m pytest tests/e2e/smoke -v --junitxml=reports/integration-smoke.xml

      - name: Chaos tests
        run: >
          python -m pytest tests/e2e/chaos -v
          -m "not manual and not needs_simulator"
          --junitxml=reports/integration-chaos.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-reports
          path: reports/
          if-no-files-found: ignore

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl get events --sort-by=.lastTimestamp | tail -n 60
          kubectl logs "deploy/$API_DEPLOYMENT" --tail=100 || true
          kubectl logs "deploy/$ANOMALY_DEPLOYMENT" --tail=100 || true
          kubectl logs "deploy/$POSTGRES_DEPLOYMENT" --tail=100 || true

  # Build each image once per merge, publish it under the commit SHA and provenance attestation.
  publish-images:
    name: publish-images (${{ matrix.service }})
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write                 # push to GHCR with GITHUB_TOKEN (no PAT)
      id-token: write                 # Sigstore signing for the attestation
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            image: motorsport-api
          - service: anomaly_service
            image: motorsport-anomaly
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          push: true
          tags: ${{ env.IMAGE_REGISTRY }}/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE_REGISTRY }}/${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # Terraform apply: manual, approval-gated, refuses to create or destroy the agent VM.
  terraform-apply:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    concurrency:
      group: terraform-state
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID_APPLY }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AGENT_VM_ADDRESS: azurerm_linux_virtual_machine.agent
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Write tfvars from secret
        env:
          TFVARS: ${{ secrets.TFVARS }}
        run: printf '%s\n' "$TFVARS" > "$TF_DIR/ci.auto.tfvars"

      - name: terraform init
        run: terraform -chdir="$TF_DIR" init

      - name: "Guard 1: the agent VM must already exist"
        run: |
          if ! terraform -chdir="$TF_DIR" state list | grep -qxF "$AGENT_VM_ADDRESS"; then
            echo "::error::$AGENT_VM_ADDRESS is not in state - the agent is DOWN."
            echo "::error::CI never creates the agent. Run agent-lifecycle.sh up on the server."
            exit 1
          fi

      - name: terraform plan
        run: |
          terraform -chdir="$TF_DIR" plan -lock-timeout=5m -out=tfplan
          {
            echo '### Plan to be applied'
            echo '```'
            terraform -chdir="$TF_DIR" show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Guard 2: no deletes or replacements"
        run: |
          terraform -chdir="$TF_DIR" show -json tfplan > plan.json
          BAD=$(jq -r '.resource_changes[]? | select(.change.actions | index("delete"))
                       | "\(.address)  [\(.change.actions | join("/"))]"' plan.json)
          if [ -n "$BAD" ]; then
            echo "::error::Plan deletes or replaces resources. Refusing: a replaced VM is never re-joined."
            echo "$BAD"
            exit 1
          fi

      - name: terraform apply (exactly the saved plan)
        run: terraform -chdir="$TF_DIR" apply -lock-timeout=5m tfplan

  # Continuous deployment: apply manifests, wait for rollouts, run smoke tests.
  deploy-and-verify:
    needs: publish-images
    if: github.event_name == 'push'
    runs-on: [self-hosted, linux, motorsport-server]
    timeout-minutes: 20
    concurrency:
      group: motorsport-cluster   # shared with resilience.yml: no deploy during chaos runs
      cancel-in-progress: false
    permissions:
      contents: read
    env:                          
      K8S_NAMESPACE: default
      API_DEPLOYMENT: motorsport-api
      API_SERVICE: motorsport-api
      ANOMALY_DEPLOYMENT: motorsport-anomaly
      POSTGRES_DEPLOYMENT: postgres
      POSTGRES_SECRET: postgres-secret
      POSTGRES_SECRET_KEY: DB_PASSWORD
      DB_NAME: motorsport
      DB_USER: pitwall
      DB_PROBE_PATH: /cars/1/latest
      CANARY_CAR_ID: "1"
      ANOMALY_POLL_SECONDS: "30"
    steps:
      - uses: actions/checkout@v7

      - name: Preflight
        run: |
          kubectl get nodes -o wide
          kubectl -n "$K8S_NAMESPACE" get secret "$POSTGRES_SECRET" > /dev/null \
            || { echo "::error::Secret $POSTGRES_SECRET is missing - it is created by hand, never from git."; exit 1; }

      - name: Deploy
        id: deploy
        run: scripts/deploy.sh apply "$GITHUB_SHA"

      - name: Install test dependencies 
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r tests/e2e/requirements.txt

      - name: Smoke tests
        id: smoke
        run: .venv/bin/python -m pytest tests/e2e/smoke -v --junitxml=reports/smoke.xml

      - name: Record known-good version
        run: scripts/deploy.sh mark-good "$GITHUB_SHA"

      - name: Upload smoke test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-report
          path: reports/

      - name: Collect diagnostics
        if: failure()
        run: |
          kubectl -n "$K8S_NAMESPACE" get pods -o wide
          kubectl -n "$K8S_NAMESPACE" get events --sort-by=.lastTimestamp | tail -n 40
          kubectl -n "$K8S_NAMESPACE" logs "deploy/$API_DEPLOYMENT" --tail=100 || true
          kubectl -n "$K8S_NAMESPACE" logs "deploy/$ANOMALY_DEPLOYMENT" --tail=100 || true
        
      - name: Rollback to last known-good version
        if: failure() && (steps.deploy.outcome == 'failure' || steps.smoke.outcome == 'failure')
        run: |
          LAST_GOOD=$(scripts/deploy.sh last-good)
          if [ -z "$LAST_GOOD" ] || [ "$LAST_GOOD" = "$GITHUB_SHA" ]; then
            echo "::error::No known-good version recorded - cannot roll back automatically."
            exit 1
          fi
          echo "::warning::Verification of $GITHUB_SHA failed - rolling back to $LAST_GOOD"

          git worktree prune
          git fetch --no-tags --depth=1 origin "$LAST_GOOD"
          WT="$RUNNER_TEMP/rollback-$LAST_GOOD"
          git worktree add --force --detach "$WT" "$LAST_GOOD"

          scripts/deploy.sh rollback "$LAST_GOOD" "$WT"

          python3 -m venv "$RUNNER_TEMP/venv-rollback"
          "$RUNNER_TEMP/venv-rollback/bin/pip" install --quiet -r "$WT/tests/e2e/requirements.txt"
          (cd "$WT" && "$RUNNER_TEMP/venv-rollback/bin/python" -m pytest tests/e2e/smoke -v)

          {
            echo "### Automatic rollback"
            echo "Deploy of \`$GITHUB_SHA\` failed verification."
            echo "Rolled back to \`$LAST_GOOD\`; its smoke tests pass."
            echo "**Next:** open a revert PR for \`$GITHUB_SHA\` so \`main\` matches the cluster again."
          } >> "$GITHUB_STEP_SUMMARY"
          git worktree remove --force "$WT"        