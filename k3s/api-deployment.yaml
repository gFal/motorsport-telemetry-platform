apiVersion: apps/v1
kind: Deployment
metadata:
  name: motorsport-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: motorsport-api
  template:
    metadata:
      labels:
        app: motorsport-api
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: motorsport-api
                topologyKey: kubernetes.io/hostname
      containers:
        - name: api
          image: ghcr.io/gfal/motorsport-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: postgres-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20