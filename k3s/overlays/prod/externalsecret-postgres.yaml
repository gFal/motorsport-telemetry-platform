# Synchronises the PostgreSQL password from Azure Key Vault into the Secret postgres-secret.
# The value is stored only in Key Vault - this manifest holds a reference to it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: azure-kv
  target:
    name: postgres-secret
    creationPolicy: Owner # the Secret is deleted together with this ExternalSecret
    template:
      type: Opaque
      data:
        # One Key Vault value populates both keys: POSTGRES_PASSWORD is read by the postgres image at first initialisation and DB_PASSWORD by the application services.
        POSTGRES_PASSWORD: "{{ .password }}"
        DB_PASSWORD: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: postgres-password