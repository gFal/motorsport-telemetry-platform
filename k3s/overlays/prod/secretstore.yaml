# Connection from External Secrets Operator to Azure Key Vault.
# Namespace-scoped: only ExternalSecrets in this namespace can read from this vault.
# Authenticates with the service principal credential in the azure-kv-credentials Secret.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: azure-kv
spec:
  provider:
    azurekv:
      authType: ServicePrincipal
      tenantId: "3180bf70-17cc-44f6-90a4-5c9476625295"
      vaultUrl: "https://kv-motorsport-0edf81.vault.azure.net"
      authSecretRef:
        clientId:
          name: azure-kv-credentials
          key: client-id
        clientSecret:
          name: azure-kv-credentials
          key: client-secret
