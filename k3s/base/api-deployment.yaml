apiVersion: apps/v1
kind: Deployment
metadata:
  name: motorsport-api
spec:
  replicas: 2
  progressDeadlineSeconds: 180
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # existing pods keep serving until replacements are available
  selector:
    matchLabels:
      app: motorsport-api
  template:
    metadata:
      labels:
        app: motorsport-api
    spec:
      securityContext:                       
        runAsNonRoot: true                   
        seccompProfile:                      
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: motorsport-api
                topologyKey: kubernetes.io/hostname
      containers:
        - name: api
          image: ghcr.io/gfal/motorsport-api:unset
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: postgres-config
            - secretRef:
                name: postgres-secret
          securityContext:                  
            allowPrivilegeEscalation: false  
            readOnlyRootFilesystem: true     
            capabilities:                    
              drop: ["ALL"]                  
          volumeMounts:                      
            - name: tmp                      
              mountPath: /tmp 
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:                               
        - name: tmp                          
          emptyDir: {}