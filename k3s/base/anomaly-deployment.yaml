apiVersion: apps/v1
kind: Deployment
metadata:
  name: motorsport-anomaly
spec:
  replicas: 1
  progressDeadlineSeconds: 120
  minReadySeconds: 20    # no readiness probe - a pod must run this long to count as available
  strategy:
    type: Recreate       # alert de-duplication state is in memory - two concurrent detectors would duplicate alerts
  selector:
    matchLabels:
      app: motorsport-anomaly
  template:
    metadata:
      labels:
        app: motorsport-anomaly
    spec:
      securityContext:                       
        runAsNonRoot: true                   
        seccompProfile:                      
          type: RuntimeDefault 
      containers:
        - name: anomaly
          image: ghcr.io/gfal/motorsport-anomaly:unset
          envFrom:
            - configMapRef:
                name: postgres-config
            - secretRef:
                name: postgres-secret
          env:                               
            - name: ALERTS_LOG_PATH          
              value: /tmp/alerts.log         
          securityContext:                   
            allowPrivilegeEscalation: false  
            readOnlyRootFilesystem: true     
            capabilities:                    
              drop: ["ALL"]
          volumeMounts:                      
            - name: tmp                      
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:                               
        - name: tmp                          
          emptyDir: {}                        