apiVersion: apps/v1
kind: Deployment
metadata:
  name: motorsport-anomaly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: motorsport-anomaly
  template:
    metadata:
      labels:
        app: motorsport-anomaly
    spec:
      containers:
        - name: anomaly
          image: ghcr.io/gfal/motorsport-anomaly:latest
          envFrom:
            - secretRef:
                name: postgres-secret
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi